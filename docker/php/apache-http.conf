# アプリは 80 番のみを担当する。
# HTTPS (443 / 証明書) はインフラ側が docker-compose.override.yml で被せる。
#
# 注意: 上書きされるのは 000-default.conf。
#       インフラ側の override は ./docker/php/vhost.conf をマウントしてくるので、
#       アプリ側はその名前を使わない (git pull --ff-only との衝突を避けるため)。

<VirtualHost *:80>
    DocumentRoot /var/www/skillmap/public
</VirtualHost>

<Directory /var/www/skillmap/public>
    AllowOverride All
    Require all granted
    Options -Indexes
</Directory>

# .env や .git がドキュメントルートに紛れた場合の保険
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
